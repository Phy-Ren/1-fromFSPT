name: Exact verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check cochain equations and stacking
        run: python cochain_oneform_verify.py
      - name: Check finite-Abelian classifications
        run: python verify_classification_snf.py
      - name: Check CLI classification labels and compatibility
        run: python -m unittest test_cli.py
      - name: Calculate example groups
        run: |
          python classify.py --orders 4,6 --twist 1,0
          python classify.py --orders 8 --twist 1 --absolute-bordism
